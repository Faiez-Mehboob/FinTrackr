{% extends "base.html" %}

{% block title %}Edit Budget - FinTrackr{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Budget</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('edit_budget', budget_month=budget.budget_month) }}" class="form-card">
        <div class="form-group">
            <label for="budget_month">Budget Month</label>
            <input type="month" id="budget_month" name="budget_month" value="{{ budget.budget_month }}" disabled
                class="form-input">
            <small>Month cannot be changed. Delete and create a new budget if needed.</small>
        </div>

        <div class="form-group">
            <label for="budget_amount">Budget Amount *</label>
            <input type="number" id="budget_amount" name="budget_amount" step="0.01" value="{{ budget.budget_amount }}"
                required class="form-input">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Budget</button>
            <a href="{{ url_for('budgets') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
