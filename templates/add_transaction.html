{% extends "base.html" %}

{% block title %}Add Transaction - FinTrackr{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Transaction</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_transaction') }}" class="form-card">
        <div class="form-group">
            <label for="account_id">Account *</label>
            <select id="account_id" name="account_id" required class="form-input">
                <option value="">Select account</option>
                {% for account in accounts %}
                <option value="{{ account.account_id }}">{{ account.account_name }} (${{ "%.2f"|format(account.balance)
                    }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="tx_type">Transaction Type *</label>
            <select id="tx_type" name="tx_type" required class="form-input">
                <option value="">Select type</option>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>
        </div>

        <div class="form-group" id="category_group">
            <label for="category_id">Category *</label>
            <select id="category_id" name="category_id" class="form-input">
                <option value="">Select category</option>
                {% for category in categories %}
                <option value="{{ category.category_id }}">{{ category.category_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount *</label>
            <input type="number" id="amount" name="amount" step="0.01" required class="form-input" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="tx_date">Transaction Date *</label>
            <input type="date" id="tx_date" name="tx_date" required class="form-input">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Transaction</button>
            <a href="{{ url_for('transactions') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    // Set today's date as default
    document.getElementById('tx_date').valueAsDate = new Date();

    // Hide/show category based on transaction type
    const txTypeSelect = document.getElementById('tx_type');
    const categoryGroup = document.getElementById('category_group');
    const categorySelect = document.getElementById('category_id');

    function toggleCategory() {
        if (txTypeSelect.value === 'Income') {
            categoryGroup.style.display = 'none';
            categorySelect.removeAttribute('required');
            categorySelect.value = '';
        } else {
            categoryGroup.style.display = 'block';
            categorySelect.setAttribute('required', 'required');
        }
    }

    // Initial state
    toggleCategory();

    // Listen for changes
    txTypeSelect.addEventListener('change', toggleCategory);
</script>
{% endblock %}
