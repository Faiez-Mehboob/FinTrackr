{% extends "base.html" %}

{% block title %}Add Budget - FinTrackr{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Monthly Budget</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_budget') }}" class="form-card">
        <div class="form-group">
            <label for="budget_month">Budget Month *</label>
            <input type="month" id="budget_month" name="budget_month" required class="form-input">
        </div>

        <div class="form-group">
            <label for="budget_amount">Budget Amount *</label>
            <input type="number" id="budget_amount" name="budget_amount" step="0.01" required class="form-input"
                placeholder="0.00">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Budget</button>
            <a href="{{ url_for('budgets') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
